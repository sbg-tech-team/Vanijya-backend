# Push to main -> verify -> migrate -> deploy.
#
# Two GitHub secrets make this work (Settings > Secrets and variables > Actions):
#
#   RENDER_API_KEY           Render dashboard > Account Settings > API Keys
#   RENDER_SERVICE_ID         srv-... (Render service id)
#   SYNC_DATABASE_URL        the production postgresql+psycopg2:// URL, for alembic
#
# Until those are set the migrate and deploy steps are SKIPPED, not failed.
#
# Migrations run HERE, before the deploy is triggered. Render's buildCommand
# never ran alembic, so every schema change depended on someone remembering.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you deploy by hand from the Actions tab

concurrency:
  group: deploy-main        # never let two deploys race
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values: these checks import the app but never open a connection.
    # storage.py and jwt_handler read env at import, so they need to be present
    # even though nothing here talks to Supabase or signs a token.
    env:
      DATABASE_URL: postgresql+asyncpg://u:p@localhost/x
      SYNC_DATABASE_URL: postgresql+psycopg2://u:p@localhost/x
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-dummy
      DATABASE_STORAGE_URL: https://example.supabase.co
      DATABASE_SERVICE_KEY: ci-dummy-key
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Architecture gate
        run: python _migration/test_architecture.py

      - name: Calling tests
        run: python tests/test_calling.py

      - name: Post indexing test
        run: python tests/test_post_indexing.py

      - name: App imports and every router registers
        run: python -c "import main; print('boot ok')"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      PROD_DB: ${{ secrets.SYNC_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run migrations
        if: env.PROD_DB != ''
        env:
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          # alembic/env.py imports the models, which pulls in storage.py and
          # jwt_handler. Both read env at import. Dummies: migrations touch
          # neither Supabase nor tokens.
          JWT_SECRET_KEY: ci-dummy
          DATABASE_STORAGE_URL: https://example.supabase.co
          DATABASE_SERVICE_KEY: ci-dummy-key
        run: alembic upgrade head

      - name: Skip migrations (no DB secret)
        if: env.PROD_DB == ''
        run: echo "::warning::SYNC_DATABASE_URL not set - migrations did NOT run."

      # Deploys, waits, smoke-tests the live service, and rolls back to the
      # previous deploy if the smoke test fails. Render calling a deploy "live"
      # only means the process booted and answered the health check once.
      - name: Deploy, verify, roll back on failure
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: python _migration/render_deploy.py

      - name: Skip deploy (no Render secrets)
        if: env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == ''
        run: echo "::warning::RENDER_API_KEY/RENDER_SERVICE_ID not set - nothing deployed."
